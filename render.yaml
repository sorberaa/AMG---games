databases:
  - name: amg-db
    databaseName: amg_racing
    user: amg_user
    plan: free

services:
  - type: web
    name: amg-racing-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: amg-db
          property: connectionString
      - key: DATABASE_PATH
        value: /app/data/amg_game.db
